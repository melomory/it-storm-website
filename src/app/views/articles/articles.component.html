<main class="articles">
  <div class="container">
    <h1 class="articles__title">Блог</h1>

    <div class="articles__head">
      <div class="articles__applied-filters">
        <div class="articles__applied-filter">
          <span>Дизайн</span>
          <button class="articles__applied-filter-button">
            <svg
              class="articles__applied-filter-button-icon"
              width="16"
              height="17"
              viewBox="0 0 16 17"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <g clip-path="url(#clip0_19421_954)">
                <line
                  x1="1.93562"
                  y1="3.1499"
                  x2="13.9564"
                  y2="15.1707"
                  stroke-linecap="round"
                />
                <line
                  x1="13.9238"
                  y1="3.12996"
                  x2="1.90301"
                  y2="15.1508"
                  stroke-linecap="round"
                />
              </g>
            </svg>
          </button>
        </div>
      </div>

      <div class="articles__filter">
        <div class="articles__filter-head">
          <span>Фильтр</span>
          <svg
            width="20"
            height="21"
            viewBox="0 0 20 21"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M10.0003 14.5C9.41693 14.5 8.83359 14.275 8.39193 13.8334L2.95859 8.40003C2.71693 8.15837 2.71693 7.75837 2.95859 7.5167C3.20026 7.27503 3.60026 7.27503 3.84193 7.5167L9.27526 12.95C9.67526 13.35 10.3253 13.35 10.7253 12.95L16.1586 7.5167C16.4003 7.27503 16.8003 7.27503 17.0419 7.5167C17.2836 7.75837 17.2836 8.15837 17.0419 8.40003L11.6086 13.8334C11.1669 14.275 10.5836 14.5 10.0003 14.5Z"
              fill="#2C2C2C"
            />
          </svg>
        </div>
        <div class="articles__filter-body">
          <div class="articles__filter-item">Сортировать</div>
        </div>
      </div>
    </div>

    <div class="articles__items">
      @for (article of articles?.items; track $index) {
      <app-article-card [article]="article"></app-article-card>
      } @empty { @if (articles?.count === 0) {
      <p>Статьи не найдены. Попробуйте изменить параметры поиска</p>
      } }
    </div>

    @if (articles && articles.pages > 1) {
    <div class="pagination">
      <button
        class="pagination__arrow"
        [class.pagination__arrow_disabled]="activeParams.page === 1"
        (click)="openPrevPage()"
      >
        <i class="chevron chevron_left"></i>
      </button>
      <div class="pagination__pages">
        @for (page of pages; track $index) {
        <a
          tabindex="0"
          role="button"
          class="pagination__page-link"
          [class.pagination__page-link_active]="
            this.activeParams.page
              ? this.activeParams.page === page
              : page === 1
          "
          (click)="openPage(page)"
          (keydown)="openPage(page)"
          >{{ page }}</a
        >
        }

        <!-- <a class="pagination__page-link pagination__page-link_active">1</a>
        <a class="pagination__page-link">2</a>
        <a class="pagination__page-link">3</a>
        <a class="pagination__page-link">4</a>
        <a class="pagination__page-link">5</a> -->
      </div>
      <button
        class="pagination__arrow"
        [class.pagination__arrow_disabled]="
          activeParams.page === articles.pages
        "
        (click)="openNextPage()"
      >
        <i class="chevron chevron_right"></i>
      </button>
    </div>
    }
  </div>
</main>
